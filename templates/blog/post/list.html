{% extends "blog/base.html" %}
{% block title %}Мій блог{% endblock %}
{% block content %}
    <h1>Блог</h1>
    {% for post in posts %}
        <h2>
        <a href="{% url 'blog:post_detail'
        post_id %}">
            {{ post.title }}
        </a>
        </h2>
        <p class="date">
        Опубліковано {{ post.publish }} від {{ post.author }}
        </p>
        {{ post.body | truncatewords:30 | linebreaks }}
    {% endfor %}
{% endblock %}
