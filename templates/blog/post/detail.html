{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
    <h1>{{ post.title }}</h1>
    <p class="date">
    Опубліковано {{ post.publish }} від {{ post.author }}
    </p>
    {{ post.body|linebreaks }}
    <p>
    <a href="{% url "blog:post_share" post.id %}">
        Поділитись поштою
    </a>
    </p>
{% endblock %}
